[project]
name = "dc-i86-llm-forecast"
version = "0.1.0"
description = "Independent agentic forecasts of DC Initiative 86 (foie gras) and what follows, pooled through a causal map"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100"]

[project.scripts]
i86 = "i86.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/i86"]

[tool.pytest.ini_options]
testpaths = ["tests"]
