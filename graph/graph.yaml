# The causal map the forecasters fill in.
#
# Each node is one forecast question with an absolute unit. `given` says which conditions a node is
# forecast under: `cells` are certified Yes shares for Initiative 86 (`all` five, the three where it
# passes, or the two `near` 50% for questions the margin barely moves), and `states` are named
# conditions on other nodes. A node with both is forecast for every cell-state pair. `exists_if` marks
# a node that is defined only when a condition holds, such as the fate of a law that passed; elsewhere
# it is false (or, for a categorical node, absent). `kind: derived` nodes are computed, never forecast.
#
# Conditions are boolean expressions over node ids, `passes`, `node.option` tests on categorical
# nodes, `and`, `or`, `not` and parentheses.
# The states of one node must be mutually exclusive and exhaustive wherever the node exists; the tests
# check this by enumerating every assignment of the nodes they mention.

measure: "DC Initiative 86, the Prohibiting Force-Feeding of Birds Act of 2026"
election_date: "2026-11-03"
as_of: "2026-10-25"
generated_for: "pre-registration before the 2026-11-03 vote"

cells:
  fail: [0.42, 0.495]
  pass: [0.505, 0.60, 0.72]

# Close bands used in summaries (the logged v1 forecasts' Yc and Nc branches).
bands:
  Yc: [0.50, 0.53]   # 0.50 < share <= 0.53
  Nc: [0.47, 0.50]   # 0.47 <= share <= 0.50

quantiles: [0.05, 0.25, 0.50, 0.75, 0.95]

# Yes shares at which forecasters give the cumulative probability for `yes_share`.
share_grid: [0.30, 0.35, 0.40, 0.45, 0.47, 0.48, 0.49, 0.50, 0.51, 0.52, 0.53, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90]
# Mass outside the grid is spread linearly down to `share_floor` and up to `share_ceiling`.
share_floor: 0.15
share_ceiling: 0.97

nodes:

  # Vote

  - id: yes_share
    kind: share_cdf
    module: vote
    question: "Initiative 86's certified Yes share."
    resolution: >-
      DCBOE certified results for the 2026-11-03 general election: Yes votes divided by Yes plus No votes
      on Initiative 86, excluding over- and under-votes. Source: electionresults.dcboe.org (the certified
      results CSV).
    scored: true

  - id: turnout
    kind: quantity
    module: vote
    unit: "votes (Yes plus No)"
    integer: true
    bounds: [50000, 500000]
    question: "Yes plus No votes on Initiative 86."
    resolution: "DCBOE certified results, as for yes_share."
    scored: true

  - id: denver_io311_passes
    kind: binary
    module: vote
    given: {cells: all}
    continuous: true
    question: "Denver Initiated Ordinance 311, Denver's 2026 foie gras sales ban measure, passes."
    resolution: "City and County of Denver certified results for the 2026-11-03 election."
    scored: true
    notes: >-
      Forecast at each DC cell so the two results can be correlated. Denver votes the same day, so DC's
      result cannot cause Denver's: the 49.5% and 50.5% cells should differ only by what one point of DC
      margin says about voters. The simulator interpolates this question across 50%.

  # What happens to Initiative 86 if it passes. All of these are defined only if it passes.

  - id: ban_status
    kind: categorical
    module: implementation
    exists_if: passes
    given: {cells: pass}
    options:
      repealed: >-
        A Council act in effect on 2028-12-01 repeals I-86 section 4(b) (the sale ban), or delays or
        suspends it so that it does not apply on that date.
      congress: >-
        Not repealed, but an enacted federal law in effect on 2028-12-01 (an appropriations rider, or a
        joint resolution of disapproval under the Home Rule Act) bars DC from implementing or enforcing
        I-86.
      court: >-
        Neither of those, but an injunction or judgment in effect on 2028-12-01 bars enforcement of
        section 4(b) as a whole. An order limited to some products or some sellers does not count.
      not_certified: >-
        None of those, and by 2028-12-01 the CFO has not made the section 8(b) certification that I-86's
        fiscal effect is included in an approved budget and financial plan.
      certified: "None of those, and the CFO has made that certification by 2028-12-01."
    question: "The status of the sale ban on 2028-12-01: the first of these options that holds."
    resolution: >-
      The first option that holds on 2028-12-01. Sources: DC Council LIMS and the DC Register (Council
      acts, and the section 8(c) notice of the CFO's certification); Congress.gov; PACER and DC court
      records.
    scored: true
    notes: >-
      The options are exclusive and ordered: give each a probability, summing to 1. Section 8(a) delays
      the provisions with a fiscal effect until their inclusion in an approved budget and financial plan;
      the map does not decide which provisions those are. `certified` and `not_certified` record the
      certification, not a legal finding about when the ban is enforceable.

  - id: ban_standing
    kind: derived
    module: implementation
    rule: "ban_status.certified or ban_status.not_certified"
    question: "The sale ban passed and is not repealed or blocked on 2028-12-01."

  - id: ban_certified
    kind: derived
    module: implementation
    rule: "ban_status.certified"
    question: "The sale ban stands and the CFO has certified its fiscal effect by 2028-12-01."

  - id: lawsuit_filed
    kind: binary
    module: implementation
    exists_if: passes
    given:
      cells: pass
      states:
        blocked: "ban_status.court"
        not_blocked: "passes and not ban_status.court"
    question: "A lawsuit challenging I-86 is filed between 2026-11-03 and 2028-12-01."
    resolution: >-
      Between 2026-11-03 and 2028-12-01, a complaint is filed in any court challenging I-86's validity,
      or seeking to bar its enforcement, in whole or in part. Sources: PACER; DC Superior Court records;
      news.
    scored: true
    notes: "A court block needs a lawsuit, so `blocked` should be 1 or very close to it."

  - id: fattened_narrowed
    kind: binary
    module: implementation
    exists_if: ban_standing
    given:
      cells: near
      states:
        certified: "ban_status.certified"
        not_certified: "ban_status.not_certified"
    question: "By 2028-12-01, 'fattened' is narrowed so liver from birds that were not force-fed is excluded."
    resolution: >-
      By 2028-12-01, a final DOEE rule published in the DC Register, or an enacted Council act, defines
      'fattened' or 'fattened bird liver product' so that liver from birds that were not force-fed is
      excluded. Guidance, forms and FAQs do not count. Sources: DC Register; DC Council LIMS.
    scored: true

  - id: pate_treated_banned
    kind: binary
    module: implementation
    exists_if: ban_standing
    given:
      cells: near
      states:
        narrowed_certified: "fattened_narrowed and ban_status.certified"
        narrowed_not_certified: "fattened_narrowed and ban_status.not_certified"
        not_narrowed_certified: "ban_standing and not fattened_narrowed and ban_status.certified"
        not_narrowed_not_certified: "ban_standing and not fattened_narrowed and ban_status.not_certified"
    question: "By 2028-12-01, DOEE treats liver from birds that were not force-fed as covered."
    resolution: >-
      Between 2027-07-01 and 2028-12-01, DOEE issues at least one notice of violation, penalty or
      written determination that treats a liver product from birds that were not force-fed (for example
      chicken-liver pate) as a fattened bird liver product. Sources: the DOEE violations database
      required by I-86 section 5(a)(5); DC Register; court records.
    scored: true

  # Direct outcomes, asked at a bare fail (49.5%) and a bare pass (50.5%). `failed` means the measure
  # failed; `removed` that it passed and was repealed or blocked by 2028-12-01; `not_certified` and
  # `certified` that it stands, without or with the CFO's certification.

  - id: foie_gras_menus
    kind: quantity
    module: direct
    unit: "DC establishments"
    integer: true
    bounds: [0, 400]
    baseline: true
    given:
      cells: near
      states:
        failed: "not passes"
        removed: "passes and not ban_standing"
        not_certified: "ban_status.not_certified"
        certified: "ban_certified"
    question: "DC establishments listing foie gras on a current menu in December 2028."
    resolution: >-
      Menu check run 2028-12-01 to 2028-12-31: search Resy, OpenTable, Google Maps and Yelp for
      DC-address food service and retail establishments listing 'foie gras', and check each establishment
      on any 2026 list published by Pro-Animal DC or in the Colorado State University study of US cities.
      Count an establishment if its own current menu (its website, or a platform menu updated in the check
      window) offers foie gras or a dish containing it. Faux, vegan, plant-based and '-style' foie gras do
      not count. Baseline: the same count as of October 2026.
    scored: true

  - id: liver_pate_menus
    kind: quantity
    module: direct
    unit: "DC establishments"
    integer: true
    bounds: [0, 1000]
    baseline: true
    given:
      cells: near
      states:
        failed: "not passes"
        removed: "passes and not ban_standing"
        standing_pate_allowed: "ban_standing and not pate_treated_banned"
        standing_pate_banned: "ban_standing and pate_treated_banned"
    question: "DC establishments listing a liver pate, mousse or terrine other than foie gras in December 2028."
    resolution: >-
      The foie_gras_menus check, counting establishments whose own current menu lists liver pate, liver
      mousse, liver terrine, chopped liver or pate de foie that is not foie gras. Baseline: the same count
      as of October 2026.
    scored: true

  - id: us_ducks_force_fed_2030
    kind: quantity
    module: direct
    unit: "birds"
    integer: true
    bounds: [0, 2000000]
    baseline: true
    given:
      cells: near
      states:
        failed: "not passes"
        not_certified_or_removed: "passes and not ban_certified"
        certified: "ban_certified"
    question: "Ducks and geese force-fed for foie gras in the United States in 2030."
    resolution: "No official source: producers do not publish volumes. Logged and not scored."
    scored: false

  - id: dc_restaurant_employment_2029
    kind: quantity
    module: direct
    unit: "thousands of jobs"
    bounds: [20, 90]
    baseline: true
    given:
      cells: near
      states:
        failed: "not passes"
        not_certified_or_removed: "passes and not ban_certified"
        certified: "ban_certified"
    question: "DC food services and drinking places employment, 2029 annual average."
    resolution: >-
      Mean of the twelve 2029 monthly values of BLS State and Metro Area employment series
      SMU11000007072200001 (all employees, food services and drinking places, District of Columbia, not
      seasonally adjusted, thousands), as published after the March 2030 benchmark. The September 2026
      value was 51.5 (FRED, retrieved 2026-10-25).
    scored: true

  - id: dc_restaurant_sales_tax_fy2029
    kind: quantity
    module: direct
    unit: "millions of dollars"
    bounds: [200, 1500]
    baseline: true
    given:
      cells: near
      states:
        failed: "not passes"
        not_certified_or_removed: "passes and not ban_certified"
        certified: "ban_certified"
    question: "DC sales tax collections on food and drink for immediate consumption, FY2029."
    resolution: >-
      FY2029 (October 2028 to September 2029) collections in the sales tax category 'Food & Drink for
      Immediate Consumption' (10% rate), as reported by the DC CFO's Office of Revenue Analysis. FY2025
      collections were $567.9 million (ORA, 'DC Restaurant Sector Lags Hotel and Other Retail in
      Post-pandemic Recovery', 2026-04-14, https://ora-cfo.dc.gov/node/1824291).
    scored: true

  - id: dc_michelin_starred_2029
    kind: quantity
    module: direct
    unit: "restaurants"
    integer: true
    bounds: [0, 60]
    baseline: true
    given:
      cells: near
      states:
        failed: "not passes"
        not_certified_or_removed: "passes and not ban_certified"
        certified: "ban_certified"
    question: "DC restaurants with one or more Michelin stars in the guide released in 2029."
    resolution: "The Michelin Guide Washington, D.C. edition released in 2029."
    scored: true

  # Political spillovers: does a vote on foie gras make bigger reforms likelier, or release pressure?

  - id: dc_animal_initiative_filed
    kind: binary
    module: spillover
    given: {cells: all}
    question: "A new DC initiative on farmed animals or animal products is filed between 2026-11-04 and 2028-12-31."
    resolution: >-
      Between 2026-11-04 and 2028-12-31, an initiative is filed with DCBOE that would add restrictions on
      the confinement, treatment or slaughter of farmed animals, or the sale of animals or animal
      products (fur included). Measures only about pets, cruelty to individual animals, wildlife, or
      force-feeding and fattened bird liver products, and measures that would repeal or relax
      animal-protection laws, do not count. Source: DCBOE initiative filings.
    scored: true

  - id: dc_another_animal_law
    kind: binary
    module: spillover
    given:
      cells: all
      states:
        filed: "dc_animal_initiative_filed"
        not_filed: "not dc_animal_initiative_filed"
    question: "DC enacts another law restricting farmed-animal treatment or animal-product sales by 2030-12-31."
    resolution: >-
      Between 2026-11-04 and 2030-12-31, a new DC law (a Council act that becomes law, or a voter
      initiative that takes effect) restricts the confinement, treatment or slaughter of farmed animals,
      or the sale of animals or animal products (fur included). Laws only about pets, cruelty to
      individual animals, wildlife, or force-feeding and fattened bird liver products (I-86 and
      amendments to it included) do not count. Sources: DC Council LIMS; DC Register; DCBOE certified
      results.
    scored: true

  - id: dc_council_farmed_animal_bills
    kind: quantity
    module: spillover
    unit: "bills"
    integer: true
    bounds: [0, 40]
    given: {cells: all}
    question: "DC Council bills on farmed animals introduced 2027-2030."
    resolution: >-
      Bills introduced 2027-01-01 to 2030-12-31 whose main subject is the treatment, confinement,
      slaughter or sale of farmed animals or their products (fur, pets and wildlife excluded). Bills
      whose main subject is I-86, force-feeding or fattened bird liver products (to amend, repeal, delay
      or fund I-86, for example) do not count. Source: DC Council LIMS.
    scored: true

  - id: paf_measures_2027_2028
    kind: pmf
    module: spillover
    labels: ["0", "1", "2", "3", "4", "5+"]
    given:
      cells: all
      states:
        denver_pass: "denver_io311_passes"
        denver_fail: "not denver_io311_passes"
    question: "Pro-Animal Future ballot measures on 2027-2028 ballots."
    resolution: >-
      Number of ballot measures sponsored by Pro-Animal Future or its affiliates (such as Pro-Animal DC)
      on any US ballot, local or statewide, with an election date in 2027 or 2028. DC measures about
      force-feeding or fattened bird liver products (a refiled or amended I-86) do not count. Sources:
      Ballotpedia; Pro-Animal Future announcements; local election offices.
    scored: true

  - id: paf_statewide_2028
    kind: binary
    module: spillover
    given:
      cells: all
      states:
        denver_pass: "denver_io311_passes"
        denver_fail: "not denver_io311_passes"
    question: "Pro-Animal Future qualifies a 2028 statewide measure on chickens, pigs, cattle or fish."
    resolution: >-
      A statewide ballot measure sponsored by Pro-Animal Future or an affiliate, restricting the
      confinement, slaughter or sale of chickens, pigs, cattle or fish or their products, is certified
      for a 2028 statewide ballot in any US state. Sources: Ballotpedia; secretary of state
      certifications.
    scored: true

  - id: us_new_coverage_2027_2032
    kind: quantity
    module: spillover
    unit: "millions of US residents"
    bounds: [0, 340]
    given:
      cells: all
      states:
        statewide: "paf_statewide_2028"
        no_statewide: "not paf_statewide_2028"
    question: "US residents newly covered by farmed-animal laws enacted 2027-2032."
    resolution: >-
      Residents (Census Bureau 2030 population estimates) of states and localities that enact, from
      2027-01-01 to 2032-12-31, a new law setting confinement, slaughter or sales standards for farmed
      animals or their products, or banning foie gras sales; each person counted once. I-86, Denver
      Initiated Ordinance 311 and any DC law about force-feeding or fattened bird liver products never
      count. A ballot measure is enacted on the date its result is certified. Sources: ASPCA and AWI state law trackers; state and local legislative records.
    scored: true

  - id: other_foie_gras_bans_2030
    kind: quantity
    module: spillover
    unit: "US states and localities"
    integer: true
    bounds: [0, 100]
    baseline: true
    given: {cells: near}
    question: "US states and localities other than DC with a foie gras sales ban in force on 2030-12-31."
    resolution: >-
      Count of US states, counties and cities other than DC with a law banning foie gras sales that is in
      force (not enjoined or repealed) on 2030-12-31. Baseline: the same count on 2026-10-25. Sources:
      state and local legislative records; PETA and Ballotpedia trackers as leads.
    scored: true

  - id: federal_preemption_2030
    kind: binary
    module: spillover
    given: {cells: near}
    question: "Federal law preempts Prop 12-style sales standards by 2030-12-31."
    resolution: >-
      Between 2026-11-03 and 2030-12-31, a federal law is enacted that preempts state or local sales
      standards for farmed animal products of the California Proposition 12 type, in whole or for pork.
      Source: Congress.gov.
    scored: true

  - id: dc_bans_other_food_2030
    kind: binary
    module: spillover
    given: {cells: near}
    question: "DC bans the sale of another food product by 2030-12-31."
    resolution: >-
      Between 2026-11-03 and 2030-12-31, DC enacts a law banning the sale, to all buyers, of a food or
      drink for human consumption defined by its content, an ingredient or additive (foods containing a
      named dye, for example), or how it was produced, other than fattened bird liver products. Age
      limits, licensing, packaging rules, school-only rules, alcohol, tobacco, cannabis and hemp
      products, temporary public-health orders and recalls do not count. Sources: DC Council LIMS; DC
      Register.
    scored: true
